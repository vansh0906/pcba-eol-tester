name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: tester, studies and regression tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: pytest (includes the Rust cross-check; cargo is preinstalled on GitHub runners)
        run: python -m pytest -q
      - name: quick run of every study
        run: python run_all.py --quick
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            docs/img/results.png

  rust:
    name: tlog log-analytics CLI (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tlog
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo run --release -- ../../results/pilot_log.csv
